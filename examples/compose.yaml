services:
  app:
    build: ..
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      APP_PASSWORD_FILE: /run/secrets/app_password
    secrets: [app_password]

secrets:
  app_password:
    file: ./app_password.txt
